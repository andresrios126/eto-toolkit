<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ETO Toolkit by Eng. Andres Rios</title>
  <meta name="description" content="Herramientas para Electro-Technical Officers offshore: entrenador de entrevistas en inglés.">
  <meta name="theme-color" content="#f4f6fa">
  <meta name="color-scheme" content="light dark">
  <!-- iOS: pantalla de inicio -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ETO Toolkit">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Aplica el tema guardado antes de pintar la página (evita un destello de otro color).
    try {
      var v = JSON.parse(localStorage.getItem('eto-theme-vars'));
      if (v) for (var k in v) document.documentElement.style.setProperty(k, v[k]);
    } catch (e) {}
    // Ícono elegido: ?icon=nombre en el enlace o el guardado. Safari lo usa al "Agregar a pantalla de inicio".
    try {
      var m = location.search.match(/[?&]icon=([a-z]+)/);
      var ic = m ? m[1] : localStorage.getItem('eto-icon');
      if (m) localStorage.setItem('eto-icon', ic);
      if (ic) {
        document.querySelector('link[rel="apple-touch-icon"]').href = 'icons/options/' + ic + '-180.png';
        document.querySelector('link[rel="icon"]').href = 'icons/options/' + ic + '-192.png';
      }
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <button id="back" class="back" aria-label="Volver" hidden>‹</button>
    <h1 id="title">ETO Toolkit<br><small>by Eng. Andres Rios</small></h1>
    <a id="me" class="me-badge" href="#/ranking" aria-label="Tu usuario y ranking" hidden></a>
    <a id="settings" class="gear" href="#/ajustes" aria-label="Ajustes">⚙️</a>
  </header>
  <main id="app" class="container">
    <p class="muted center">Cargando…</p>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="container">Esta app necesita JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
